name: Windows build and release
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==9.1.1 pyinstaller==6.19.0
      - name: Install VLC and Inno Setup
        run: |
          choco install vlc --version=3.0.21 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python -m pytest -q
      - name: Bundle desktop application
        run: >-
          pyinstaller --noconfirm --windowed --name PAF-Videos
          --paths src --collect-all paf_videos --add-data "assets;assets"
          --add-data "C:\Program Files\VideoLAN\VLC;vlc"
          run.py
      - name: Bundle update helper
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PAF-Videos.Update update_helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\PAF-Videos.Update.exe dist\PAF-Videos\PAF-Videos.Update.exe
      - name: Include third-party license notices
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md dist\PAF-Videos\THIRD_PARTY_NOTICES.md
          Copy-Item licenses dist\PAF-Videos\licenses -Recurse
      - name: Test bundled EXE
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'portable-smoke.json'
          $process = Start-Process dist\PAF-Videos\PAF-Videos.exe -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Portable EXE timed out' }
          if ($process.ExitCode -ne 0) { if (Test-Path $report) { Get-Content $report }; throw 'Portable EXE failed' }
          if (-not (Test-Path $report)) { throw 'Missing portable smoke-test report' }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.ok -or $result.decoded_audio -le 0) { throw 'VLC smoke test failed' }
          Get-Content $report
      - name: Build installer and update manifest
        shell: pwsh
        run: |
          $env:PAF_VERSION = python -c "import sys; sys.path.insert(0,'src'); from paf_videos import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$env:PAF_VERSION") { throw 'Release tag does not match application version' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\PAFVideos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-Item dist\setup.exe
          @{version=$env:PAF_VERSION; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower(); size=$file.Length} | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM dist\update.json
          Compress-Archive dist\PAF-Videos\* dist\PAF-Videos-portable.zip
      - name: Test installed application and update handoff
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PAF-Videos-installed'
          $setup = (Resolve-Path dist\setup.exe).Path
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`"" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installation timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $installDir 'PAF-Videos.exe'
          $report = Join-Path $env:RUNNER_TEMP 'installed-smoke.json'
          $process = Start-Process $exe -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Installed EXE timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed EXE failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).ok) { throw 'Installed smoke test failed' }
          $manifest = Get-Content dist\update.json | ConvertFrom-Json
          $process = Start-Process $exe -ArgumentList "--test-update `"$setup`" $($manifest.sha256) $($manifest.size)" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Update launch timed out' }
          if ($process.ExitCode -ne 0) { throw 'Update launch failed' }
          $updateResult = [IO.Path]::ChangeExtension($setup, '.result.json')
          $deadline = [DateTime]::UtcNow.AddSeconds(150)
          while (-not (Test-Path $updateResult) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $updateResult)) { throw 'Update helper did not finish' }
          $result = Get-Content $updateResult | ConvertFrom-Json
          if (-not $result.ok) { Get-Content $updateResult; throw 'Update installation failed' }
          Get-Content $updateResult
          Remove-Item $report
          $process = Start-Process $exe -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Updated EXE timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Updated EXE failed' }
          if (-not (Get-Content $report | ConvertFrom-Json).ok) { throw 'Updated smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PAF-Videos-Windows
          path: |
            dist/setup.exe
            dist/update.json
            dist/PAF-Videos-portable.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/setup.exe dist/update.json dist/PAF-Videos-portable.zip --verify-tag --draft --title "PAF-Videos $env:GITHUB_REF_NAME" --notes-file docs/release-notes-0.1.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0 -or $assets -ne '3') { throw 'Release is incomplete; keeping draft unpublished' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
