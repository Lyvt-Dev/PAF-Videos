name: Native C++ Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        run: |
          $env:PAF_VERSION = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'set\(PAF_RELEASE_VERSION "([0-9.]+(?:-fix)?)"\)').Groups[1].Value
          if (-not $env:PAF_VERSION) { throw 'Missing version' }
          "PAF_VERSION=$env:PAF_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$env:PAF_VERSION") { throw 'Release tag does not match application version' }
      - name: Build native x64 C++ binaries
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object build/build.log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            Get-Content build/build.log | Where-Object { $_ -match 'error (C[0-9]+|LNK[0-9]+|RC[0-9]+|MSB[0-9]+)' } | ForEach-Object { Write-Output "::error::$_" }
          }
          exit $result
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Install verified VLC package and Inno Setup
        run: |
          choco install vlc --version=3.0.21 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package bundled VLC runtime and native application
        shell: pwsh
        run: |
          try {
            New-Item -ItemType Directory dist/PAF-Videos/vlc -Force | Out-Null
            Copy-Item build/Release/PAF-Videos.exe,build/Release/PAF-Videos.Update.exe,LICENSE,THIRD_PARTY_NOTICES.md dist/PAF-Videos/
            Copy-Item 'C:\Program Files\VideoLAN\VLC\*' dist/PAF-Videos/vlc -Recurse
            Get-ChildItem dist/PAF-Videos/vlc/*.exe | Remove-Item
            Get-ChildItem dist/PAF-Videos/vlc -Filter plugins.dat -Recurse | Remove-Item
            Copy-Item README.md dist/PAF-Videos/README.md
            # Prevent a globally installed VLC from hiding missing bundled DLLs or plugins.
            choco uninstall vlc -y 2>&1 | Tee-Object build/vlc-uninstall.log
            if ($LASTEXITCODE -ne 0) {
              $details = (Get-Content build/vlc-uninstall.log -Tail 35) -join ' | '
              Write-Output "::error::VLC uninstall failed: $details"
              exit 1
            }
            # Chocolatey/VLC can leave files after a successful uninstall on hosted runners.
            # This directory was installed by this job; the runtime copy in dist is retained.
            if (Test-Path 'C:\Program Files\VideoLAN\VLC') {
              Remove-Item 'C:\Program Files\VideoLAN\VLC' -Recurse -Force
            }
            if (Test-Path 'C:\Program Files\VideoLAN\VLC\libvlc.dll') { throw 'Global VLC is still installed' }
          } catch {
            Write-Output "::error::Native package creation failed: $($_.Exception.Message)"
            throw
          }
      - name: Test portable native player without installed VLC
        shell: pwsh
        run: |
          & scripts/test-windows.ps1 -Exe (Resolve-Path dist/PAF-Videos/PAF-Videos.exe).Path -Fixture (Resolve-Path tests/fixtures/sample.mp4).Path -Prefix 'portable'
      - name: Build installer and update manifest
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/PAFVideos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-Item dist/setup.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          $manifest = '{"version":"' + $env:PAF_VERSION + '","sha256":"' + $hash + '","size":' + $file.Length + '}'
          [IO.File]::WriteAllText((Join-Path $pwd 'dist/update.json'), $manifest, [Text.UTF8Encoding]::new($false))
          Compress-Archive dist/PAF-Videos/* dist/PAF-Videos-portable.zip
      - name: Test installation and native update helper
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PAF-Videos-installed'
          $setup = (Resolve-Path dist/setup.exe).Path
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`"" -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Installation timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = Join-Path $installDir 'PAF-Videos.exe'
          $fixture = (Resolve-Path tests/fixtures/sample.mp4).Path
          & scripts/test-windows.ps1 -Exe $exe -Fixture $fixture -Prefix 'installed'
          $manifest = Get-Content dist/update.json | ConvertFrom-Json
          $process = Start-Process $exe -ArgumentList "--test-update `"$setup`" $($manifest.sha256) $($manifest.size)" -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Update launch timed out' }
          if ($process.ExitCode -ne 0) { throw 'Update launch failed' }
          $resultFile = [IO.Path]::ChangeExtension($setup, '.result.json')
          $deadline = [DateTime]::UtcNow.AddSeconds(150)
          while (-not (Test-Path $resultFile) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $resultFile)) { throw 'Update helper did not finish' }
          $result = Get-Content $resultFile | ConvertFrom-Json
          if (-not $result.ok) { throw "Native update installer returned $($result.installer_exit_code)" }
          & scripts/test-windows.ps1 -Exe $exe -Fixture $fixture -Prefix 'updated'
      - uses: actions/upload-artifact@v4
        with:
          name: PAF-Videos-Windows-native
          path: |
            dist/setup.exe
            dist/update.json
            dist/PAF-Videos-portable.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/setup.exe dist/update.json dist/PAF-Videos-portable.zip --verify-tag --draft --title "PAF-Videos $env:GITHUB_REF_NAME – Native C++" --notes-file "docs/release-notes-$env:PAF_VERSION.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets | length'
          if ($LASTEXITCODE -ne 0 -or $assets -ne '3') { throw 'Release is incomplete; keeping draft unpublished' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
